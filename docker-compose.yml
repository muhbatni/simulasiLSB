services:
  # 1. PostgreSQL Database Tier 17
  postgres:
    image: postgres:17-alpine
    container_name: lsb_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lsb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lsb_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lsb_certificate_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lsb_user} -d ${POSTGRES_DB:-lsb_certificate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lsb_network

  # 2. Application Backend Tier: NestJS Modular API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lsb_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://lsb_user:lsb_password_2026@postgres:5432/lsb_certificate_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-simulasi-lsb-uin-secret-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      FRONTEND_URL: "http://localhost,http://localhost:80,http://frontend:80"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - lsb_network

  # 3. Client Frontend Tier: Vue.js 3 + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lsb_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - lsb_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  lsb_network:
    driver: bridge
