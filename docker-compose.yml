services:
  # 1. PostgreSQL Database Tier (Proposal 3.1.4.2 D)
  postgres:
    image: postgres:15-alpine
    container_name: lsb_postgres
    restart: always
    environment:
      POSTGRES_USER: lsb_user
      POSTGRES_PASSWORD: lsb_password_2026
      POSTGRES_DB: lsb_certificate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lsb_network

  # 2. Application Backend Tier: NestJS Modular API (Proposal 3.1.4.2 & 3.1.4.3)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lsb_backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://lsb_user:lsb_password_2026@postgres:5432/lsb_certificate_db?schema=public"
      JWT_SECRET: "simulasi-lsb-uin-secret-key-2026"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    networks:
      - lsb_network

  # 3. Client Frontend Tier: Vue.js 3 + Nginx (Proposal 3.1.4.2 & 3.1.4.3)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lsb_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - lsb_network

volumes:
  postgres_data:
  backend_uploads:
  backend_data:

networks:
  lsb_network:
    driver: bridge
